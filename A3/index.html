<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layered Project Stage Cards</title>
    <style>
        body {
            background-color: azure;
            background-attachment: fixed;
            font-family: Arial, Helvetica, sans-serif;
            font-display: block;
        }
        h1 {
            color: brown;
        }
        .container {
            background: fixed;
            inline-size: auto;
            margin-inline-start: auto;
            box-shadow: black;
            gap: 8px;

        }
        .card {
            width: fit-content;
            height: fit-content;
            margin: auto;
            margin-left: 10%;
            margin-top: 8%;
            padding-left: 10%;
            padding-right: 10%;
            font-size: small;
            transition: all 0.3s ease-in-out;
            transform: scale(1.05);
            box-shadow: 0 8px 16px black;
        }
        .card:hover {
            transform:translate();
            transition: cubic-bezier(1, 0, 0, 1);

        }
        .card2 {
            width: fit-content;
            height: fit-content;
            margin: auto;
            margin-left: 10%;
            padding-left: 10%;
            font-size: small;
            transition: all 0.3s ease-in-out;
            transform: scale(1.05);
            box-shadow: 0 8px 16px black;
        }
        .card2:hover {
            transform:translate();
            transition: cubic-bezier(1, 0, 0, 1);

        }
        .card3 {
            width: fit-content;
            height: fit-content;
            margin: auto;
            margin-left: 10%;
            padding-left: 10%;
            font-size: small;
            transition: all 0.3s ease-in-out;
            transform: scale(1.05);
            box-shadow: 0 8px 16px black;
        }
        .card3:hover{
            transform:translate();
            transition: cubic-bezier(1, 0, 0, 1);
        }
    </style>
</head>
<body>
    <h1>Project Stages</h1>

    <div class="container">
        <div class="card">
            <h3>STAGE 1</h3>
            <h2>Descovery</h2>
            <h3>Understand the problem and gather context.</h3>
        </div>
        <div class="card2">
            <h3>STAGE 2</h3>
            <h2>Design</h2>
            <h3>Sketch ideas and explore user flows.</h3>
        </div>
        <div class="card3">
            <h3>STAGE 3</h3>
            <h2>Delivery</h2>
            <h3>Build the solution and prepare for launch.</h3>
        </div>
    </div>
</body>
</html>
