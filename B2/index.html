<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List with Progress Bar</title>
    <style>
        body{
            background-color: aliceblue;
            background: fixed;
            font-family: Arial, Helvetica, sans-serif;
        }
        h1 {
            text-align: justify;
            margin-left: 10%;
            margin-top: 10%;
        }
        .card{
            width: fit-content;
            height: fit-content;
            margin-left: 20%;
        }
        :checked {
            box-sizing: border-box;

        }
        
    </style>
</head>
<body>
    <h1>Today's checklist</h1>
    <div class="card">
        <h2>Review design feedback</h2>
        <h2>Implement navigation changes</h2>
        <h2>Test layout on mobile</h2>
        <h2>Prepare deployment notes</h2>
        <h2>Share update with the team</h2>
    </div>

</body>
</html>
